<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Salesforce sign-in</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>body{font-family:"Segoe UI",system-ui,sans-serif;padding:24px;color:#333}</style>
</head>
<body>
  <p>Finishing sign-in…</p>
  <script>
    Office.onReady(() => {
      const p = new URLSearchParams(location.search);
      Office.context.ui.messageParent(JSON.stringify({
        code: p.get("code"),
        state: p.get("state"),
        error: p.get("error"),
        error_description: p.get("error_description"),
      }));
    });
  </script>
</body>
</html>
